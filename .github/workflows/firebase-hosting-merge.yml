name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write config-local.js from secrets
        run: |
          cat > js/config-local.js << 'EOF'
          export const LOCAL_CONFIG = {
            GOOGLE_PLACES_API_KEY: '${{ secrets.GOOGLE_PLACES_API_KEY }}',
            EXCHANGE_RATE_API_KEY: '${{ secrets.EXCHANGE_RATE_API_KEY }}',
            OPENWEATHER_API_KEY: '${{ secrets.OPENWEATHER_API_KEY }}'
          };
          EOF
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAPAN_ITIN_DEV }}
          channelId: live
          projectId: japan-itin-dev
  deploy_firestore_rules:
    needs: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify membership rules in the emulator
        run: npx --yes firebase-tools@14.27.0 emulators:exec --only firestore --project demo-japitin-rules "npm run test:rules"
      - name: Check whether rules changed
        id: rules_changes
        run: |
          if git diff --quiet HEAD^ HEAD -- firestore.rules; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy verified Firestore rules
        if: steps.rules_changes.outputs.changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAPAN_ITIN_DEV }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/japitin-firestore-service-account.json
        run: |
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node -e "require('node:fs').writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, process.env.FIREBASE_SERVICE_ACCOUNT, {mode: 0o600})"
          npx --yes firebase-tools@14.27.0 deploy --only firestore:rules --project japan-itin-dev --non-interactive
